name: Sync Notion to GitHub

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Remove previous generated Notion files
      - name: Clean previous Notion sync
        run: |
          rm -rf python_learning/HDFC-Life-Intern-HUB
          rm -rf python_learning/HDFC-Life-Intern-HUB-2
          rm -f python_learning/HDFC-Life-Intern-HUB.md
          rm -f python_learning/HDFC-Life-Intern-HUB-2.md

      - name: Run Notion Sync
        uses: batuhan/notion-sync-action@main
        with:
          notion_token: ${{ secrets.NOTION_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: full
          path_filter: '**/.notion.txt'
          assets_dir: notion-assets
          commit: false
          dry_run: false

      - name: Commit synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync Notion to GitHub"
            git push
          fi
